<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CookIt</title>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    // Helper für Lucide Icons
    const Icon = ({ name, size = 20, className = "" }) => {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current && window.lucide) {
          ref.current.innerHTML = `<i data-lucide="${name}"></i>`;
          window.lucide.createIcons({
            attrs: { width: size, height: size, class: className }
          });
        }
      }, [name, size, className]);
      return <span ref={ref} className="inline-flex items-center justify-center" />;
    };

    const SUGGESTIONS = ["Ei", "Nudeln", "Reis", "Kartoffeln", "Zwiebel", "Knoblauch", "Tomaten", "Paprika", "Karotten", "Champignons", "Käse", "Milch", "Hähnchen", "Hackfleisch", "Speck", "Butter"];

    // Dummy-Rezept-Generator für zuverlässige Browser-Ausgabe ohne CORS-Fehler
    function generateMockRecipes(ingredients) {
      const listStr = ingredients.join(", ");
      return [
        {
          id: "1",
          title: `Schnelle ${ingredients[0] || 'Zutaten'}-Pfanne`,
          description: `Kombiniere ${listStr} in einer heißen Pfanne für ein schnelles Gericht.`,
          time: "15 Min.",
          difficulty: "Einfach",
          servings: "2 Portionen",
          ingredients: ingredients.map(i => ({ name: i, amount: "nach Geschmack" })),
          steps: [
            { title: "Vorbereiten", content: `Schneide ${listStr} in kleine Stücke.` },
            { title: "Anbraten", content: "Erhitze etwas Öl in einer Pfanne und brate die Zutaten goldbraun an." },
            { title: "Abschmecken", content: "Mit Salz, Pfeffer und Kräutern verfeinern und heiß servieren." }
          ]
        },
        {
          id: "2",
          title: `Ofengemüse mit ${ingredients[1] || ingredients[0] || 'Zutaten'}`,
          description: "Knusprig gebacken aus dem Ofen mit feinen Gewürzen.",
          time: "30 Min.",
          difficulty: "Einfach",
          servings: "2 Portionen",
          ingredients: ingredients.map(i => ({ name: i, amount: "1 Portion" })),
          steps: [
            { title: "Ofen vorheizen", content: "Den Backofen auf 200°C Ober-/Unterhitze vorheizen." },
            { title: "Mischen", content: "Die Zutaten auf einem Blech verteilen und mit Olivenöl beträufeln." },
            { title: "Backen", content: "Für ca. 20–25 Minuten backen, bis alles knusprig ist." }
          ]
        }
      ];
    }

    function CookIt() {
      const [screen, setScreen] = useState("input");
      const [ingredients, setIngredients] = useState([]);
      const [inputValue, setInputValue] = useState("");
      const [recipes, setRecipes] = useState([]);
      const [detail, setDetail] = useState(null);
      const [doneSteps, setDoneSteps] = useState({});

      function addIngredient() {
        if (!inputValue.trim()) return;
        if (!ingredients.includes(inputValue.trim())) {
          setIngredients([...ingredients, inputValue.trim()]);
        }
        setInputValue("");
      }

      function removeIngredient(idx) {
        setIngredients(ingredients.filter((_, i) => i !== idx));
      }

      function findRecipes() {
        setScreen("loading");
        setTimeout(() => {
          const generated = generateMockRecipes(ingredients);
          setRecipes(generated);
          setScreen("options");
        }, 800);
      }

      function selectRecipe(recipe) {
        setDetail(recipe);
        setDoneSteps({});
        setScreen("detail");
      }

      return (
        <div className="max-w-md mx-auto min-h-screen bg-white shadow-md flex flex-col font-sans">
          {/* Header */}
          <div className="p-4 border-b flex items-center justify-between">
            <div className="flex items-center gap-2">
              <div className="w-8 h-8 bg-orange-500 rounded-lg flex items-center justify-center text-white font-bold">
                <Icon name="utensils" size={18} />
              </div>
              <span className="font-bold text-lg">CookIt</span>
            </div>
            {screen !== "input" && (
              <button 
                onClick={() => setScreen("input")} 
                className="text-sm font-semibold text-orange-500 hover:underline"
              >
                Neustart
              </button>
            )}
          </div>

          {/* Screen: Input */}
          {screen === "input" && (
            <div className="p-6 flex-1 flex flex-col">
              <h1 className="text-2xl font-bold mb-1">Was hast du zu Hause?</h1>
              <p className="text-gray-500 text-sm mb-6">Gib deine Zutaten ein und erhalte passende Rezepte.</p>

              <div className="flex gap-2 mb-4">
                <input
                  type="text"
                  className="flex-1 border border-gray-300 rounded-xl px-4 py-3 text-base focus:outline-none focus:border-orange-500"
                  placeholder="z.B. Tomaten, Eier, Reis"
                  value={inputValue}
                  onChange={(e) => setInputValue(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" && addIngredient()}
                />
                <button 
                  onClick={addIngredient}
                  className="bg-black text-white px-5 rounded-xl font-semibold hover:bg-gray-800 transition"
                >
                  <Icon name="plus" size={20} />
                </button>
              </div>

              {/* Suggestions */}
              <div className="mb-6">
                <p className="text-xs font-semibold text-gray-400 mb-2 uppercase tracking-wider">Vorschläge</p>
                <div className="flex flex-wrap gap-2">
                  {SUGGESTIONS.filter(s => !ingredients.includes(s)).slice(0, 8).map(s => (
                    <button
                      key={s}
                      onClick={() => setIngredients([...ingredients, s])}
                      className="border border-gray-200 rounded-full px-3 py-1 text-sm font-medium hover:border-orange-500 hover:text-orange-500"
                    >
                      + {s}
                    </button>
                  ))}
                </div>
              </div>

              {/* Selected Ingredients */}
              {ingredients.length > 0 && (
                <div className="mb-6">
                  <p className="text-xs font-semibold text-gray-400 mb-2 uppercase tracking-wider">Deine Zutaten</p>
                  <div className="flex flex-wrap gap-2">
                    {ingredients.map((ing, idx) => (
                      <span key={idx} className="bg-orange-100 text-orange-700 px-3 py-1.5 rounded-full text-sm font-semibold flex items-center gap-2">
                        {ing}
                        <button onClick={() => removeIngredient(idx)} className="hover:text-orange-900">
                          <Icon name="x" size={14} />
                        </button>
                      </span>
                    ))}
                  </div>
                </div>
              )}

              <div className="mt-auto">
                <button
                  disabled={ingredients.length === 0}
                  onClick={findRecipes}
                  className="w-full bg-orange-500 text-white font-bold py-4 rounded-xl shadow-lg disabled:opacity-40 disabled:shadow-none hover:bg-orange-600 transition"
                >
                  Rezepte finden
                </button>
              </div>
            </div>
          )}

          {/* Screen: Loading */}
          {screen === "loading" && (
            <div className="flex-1 flex flex-col items-center justify-center p-6 text-center">
              <div className="animate-spin text-orange-500 mb-4">
                <Icon name="loader-2" size={36} />
              </div>
              <p className="font-semibold text-gray-600">Suche passende Rezepte...</p>
            </div>
          )}

          {/* Screen: Options */}
          {screen === "options" && (
            <div className="p-6 flex-1 flex flex-col">
              <h1 className="text-xl font-bold mb-4">Vorgeschlagene Gerichte</h1>
              <div className="space-y-4">
                {recipes.map((r) => (
                  <div 
                    key={r.id} 
                    onClick={() => selectRecipe(r)}
                    className="border border-gray-200 rounded-2xl p-4 hover:border-orange-500 cursor-pointer transition bg-gray-50 hover:bg-white"
                  >
                    <h3 className="font-bold text-lg mb-1">{r.title}</h3>
                    <p className="text-gray-600 text-sm mb-3">{r.description}</p>
                    <div className="flex gap-4 text-xs font-semibold text-gray-500">
                      <span className="flex items-center gap-1"><Icon name="clock" size={14} /> {r.time}</span>
                      <span className="flex items-center gap-1"><Icon name="users" size={14} /> {r.servings}</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Screen: Detail */}
          {screen === "detail" && detail && (
            <div className="p-6 flex-1 flex flex-col">
              <button 
                onClick={() => setScreen("options")} 
                className="text-orange-500 font-semibold text-sm mb-4 flex items-center gap-1"
              >
                <Icon name="chevron-left" size={16} /> Zurück zur Auswahl
              </button>
              <h1 className="text-2xl font-bold mb-2">{detail.title}</h1>
              <div className="flex gap-4 text-xs font-semibold text-gray-500 mb-6">
                <span className="flex items-center gap-1"><Icon name="clock" size={14} /> {detail.time}</span>
                <span className="flex items-center gap-1"><Icon name="users" size={14} /> {detail.servings}</span>
              </div>

              <h2 className="font-bold text-lg mb-2">Zutaten</h2>
              <ul className="mb-6 space-y-2">
                {detail.ingredients.map((ing, i) => (
                  <li key={i} className="flex justify-between border-b pb-1 text-sm">
                    <span>{ing.name}</span>
                    <span className="text-gray-500">{ing.amount}</span>
                  </li>
                ))}
              </ul>

              <h2 className="font-bold text-lg mb-2">Zubereitung</h2>
              <div className="space-y-4 mb-6">
                {detail.steps.map((step, idx) => (
                  <div 
                    key={idx} 
                    onClick={() => setDoneSteps({ ...doneSteps, [idx]: !doneSteps[idx] })}
                    className={`p-3 rounded-xl border flex gap-3 cursor-pointer ${doneSteps[idx] ? 'bg-green-50 border-green-200 opacity-60' : 'bg-gray-50 border-gray-200'}`}
                  >
                    <div className={`w-6 h-6 rounded-full flex items-center justify-center font-bold text-xs ${doneSteps[idx] ? 'bg-green-500 text-white' : 'bg-orange-500 text-white'}`}>
                      {doneSteps[idx] ? "✓" : idx + 1}
                    </div>
                    <div>
                      <h4 className="font-bold text-sm">{step.title}</h4>
                      <p className="text-xs text-gray-600">{step.content}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CookIt />);
  </script>
</body>
</html>
